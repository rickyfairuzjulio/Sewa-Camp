services:
  - type: web
    name: campsewa
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: RUN_MIGRATIONS
        value: true
      - key: SEED_DATABASE
        value: true

